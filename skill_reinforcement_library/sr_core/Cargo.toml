[package]
name = "sr_core"
version = "0.1.0"
edition = "2024"

[dependencies]
z3_bridge = { path = "../z3_bridge" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sr"
path = "src/lib.rs"

[[bin]]
name = "skill_reinforcement"
path = "bin/main.rs"
